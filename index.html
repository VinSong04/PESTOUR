    <style>

        flex-direction: column;
        gap: 1.25rem;
      }
      #root:empty::before {
        content: '';
        width: 3.5rem;
        height: 3.5rem;
        border: 2px solid rgba(34,211,238,0.15);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: _spin 0.8s linear infinite;

        content: 'Loading';
        font-family: system-ui, sans-serif;
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4em;
